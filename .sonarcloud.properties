# SonarQube Cloud automatic analysis.
#
# tests/ holds plain-PHP regression scripts with their own stand-ins for
# WordPress functions (wp_send_json_error, get_option, ...). Analysed as main
# code, Sonar takes those as the real signatures and flags plugin calls as
# having the wrong argument count, so they are analysed as tests instead.
# vendor/ and output/ are not in git; listed for completeness.
sonar.sources=.
sonar.exclusions=tests/**,vendor/**,output/**,bin/**
sonar.tests=tests

# WordPress naming: functions, methods and properties are snake_case and
# classes are Underscore_Separated (AVBK_Db), per the WordPress Coding
# Standards. Sonar's php:S100 (functions/methods), php:S101 (classes) and
# php:S116 (fields) expect camelCase/PascalCase and would flag nearly every
# declaration. Same three rules as set under Administration -> Analysis scope
# in SonarQube Cloud; kept here so the choice is versioned with the code.
sonar.issue.ignore.multicriteria=wpfn,wpcls,wpfld,tplreq1,tplreq2,tplreq3,tplid
sonar.issue.ignore.multicriteria.wpfn.ruleKey=php:S100
sonar.issue.ignore.multicriteria.wpfn.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.wpcls.ruleKey=php:S101
sonar.issue.ignore.multicriteria.wpcls.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.wpfld.ruleKey=php:S116
sonar.issue.ignore.multicriteria.wpfld.resourceKey=**/*.php

# php:S2003 wants require_once. The admin templates are deliberately included
# with plain require: a template can be rendered more than once per request
# (admin/dispute-card.php and admin/member-household-credit.php inside a loop,
# admin/company-report.php both inline and buffered), and require_once would
# silently render only the first one.
sonar.issue.ignore.multicriteria.tplreq1.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.tplreq1.resourceKey=admin/**
sonar.issue.ignore.multicriteria.tplreq2.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.tplreq2.resourceKey=includes/class-admin.php
sonar.issue.ignore.multicriteria.tplreq3.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.tplreq3.resourceKey=includes/class-company-admin.php

# Web:S7930 reads class-admin.php as one HTML document. Its two
# id="avbk-clear-qr" buttons belong to different preview pages
# (handle_preview_request_payment_email and handle_preview_payment_request),
# never to the same document.
sonar.issue.ignore.multicriteria.tplid.ruleKey=Web:S7930
sonar.issue.ignore.multicriteria.tplid.resourceKey=includes/class-admin.php
