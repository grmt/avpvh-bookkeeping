name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.15.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Determine tag and version
        id: meta
        # The tag comes in through env, never pasted into the script: a
        # dispatch input like `v1"; curl … #` would otherwise run as shell.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3, got: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          # Production runs PHP 8.4.
          php-version: '8.4'
          tools: composer

      # vendor/ is not in git but the plugin needs it at runtime
      # (chillerlan/php-qrcode for the flyer and payment QR codes).
      - name: Install runtime dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      # Same contents as a production deploy: `git archive` honours
      # .gitattributes' export-ignore (tests, docs, *.md, dotfiles,
      # composer.json/.lock), plus the freshly installed vendor/.
      - name: Package avpvh-bookkeeping.zip
        run: |
          STAGE_DIR="$(mktemp -d)/avpvh-bookkeeping"
          mkdir -p "$STAGE_DIR"
          git archive HEAD | tar -x -C "$STAGE_DIR"
          cp -a vendor "$STAGE_DIR/vendor"
          test -f "$STAGE_DIR/vendor/autoload.php"
          test -d "$STAGE_DIR/vendor/chillerlan/php-qrcode"
          (cd "$(dirname "$STAGE_DIR")" && zip -qr "$GITHUB_WORKSPACE/avpvh-bookkeeping.zip" avpvh-bookkeeping)
          unzip -l "$GITHUB_WORKSPACE/avpvh-bookkeeping.zip" | tail -1

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" avpvh-bookkeeping.zip --clobber
          else
            gh release create "$TAG" avpvh-bookkeeping.zip \
              --title "avpvh-bookkeeping ${VERSION}" \
              --generate-notes
          fi
