name: "CI"
on:
  push:
    # "*" only matches single-segment branch names (no "/") — "**" is
    # needed to also cover "fix/..."-style branches (see avpvh-members'
    # same workflow, which hit this).
    branches: "**"
  pull_request:
env:
  cache-version: 1
jobs:
  lint:
    name: "Tests (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    # The PHP floor (the servers' PHP) and the newest PHP.
    strategy:
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, dom, simplexml, mbstring, fileinfo
          coverage: none

      - name: "Cache Composer dependencies"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: "~/.composer/cache"
          key: composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Install Composer dependencies"
        run: |
          composer install -n --prefer-dist

      - name: "Run test suite"
        # Loops over every tests/*.php file instead of listing each one as
        # its own step — a new test file used to need a matching step
        # added here by hand, and nothing caught it if that was forgotten
        # (found 2026-10-30: 7 of 16 test files had no step at all, so they
        # never ran in CI). ::group::/::endgroup:: keeps each test's output
        # foldable in the Actions log, same readability as separate steps.
        run: |
          status=0
          for f in tests/*.php; do
            echo "::group::$f"
            if php "$f"; then
              echo "PASS: $f"
            else
              echo "FAIL: $f"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: "Company workbook upload browser handler regression"
        run: node tests/test-company-export.cjs

      - name: "Invoice mailbox and statement extraction tests"
        run: python3 -m unittest discover -s tests -p 'test_company_*.py'

  # Shared with the other own plugins: dependencies on the PHP floor, syntax on
  # 8.4 and 8.5, PHPCompatibility and the WordPress.org Plugin Check.
  plugin-checks:
    name: "Shared"
    needs: lint
    uses: grmt/wp-plugin-ci/.github/workflows/plugin-checks.yml@main
    with:
      slug: avpvh-bookkeeping
      # Keep checking association compatibility alongside the standalone
      # company mode: the sibling members plugin supplies AVPVH_DB and
      # AVPVH_Roles to the association workflows.
      extra-plugins: |
        grmt/avpvh-members
      exclude-directories: |
        .claude
        bin
        tests
      # Agent instruction docs live at the plugin root on purpose; they
      # aren't shipped plugin content (exact filenames only, globs are
      # not matched by plugin-check-action).
      exclude-files: |
        .gitignore
        .gitattributes
        AGENTS.md
        CLAUDE.md
      # No whole checks are skipped; the codes below are ignored one by one.
      #
      # DirectDatabaseQuery.*: this plugin's whole DB layer is custom $wpdb
      # queries (see class-db.php), with schema changes in its migrations —
      # an architectural choice, not a gap, same reasoning as avpvh-members.
      #
      # NonPrefixedVariableFound: the admin/*.php files are template partials
      # only ever `include`d from inside a class method (see class-admin.php's
      # render calls), never loaded standalone, so their top-level variables
      # aren't really in the global namespace at runtime.
      #
      # Verified false positives, not a real backlog (checked every
      # handler by hand on 2026-08-24): every admin-post/admin-ajax
      # handler in this plugin calls check_admin_referer()/
      # check_ajax_referer() before touching $_POST — the Nonce
      # sniff just doesn't correlate that across the function. Every
      # flagged $_POST/$_GET/$_FILES read is already either cast
      # ((int)/(float)/array_map('intval', ...)) or run through
      # sanitize_*(wp_unslash(...)) — the sniff doesn't recognize
      # sanitization inside a `(int) ($_POST['x'] ?? 0)` cast, or
      # is_uploaded_file() as the correct check for a $_FILES tmp_name.
      ignore-codes: |
        WordPress.Security.NonceVerification.Missing
        WordPress.Security.NonceVerification.Recommended
        WordPress.Security.ValidatedSanitizedInput.InputNotSanitized
        WordPress.Security.ValidatedSanitizedInput.InputNotValidated
        WordPress.Security.ValidatedSanitizedInput.MissingUnslash
        plugin_updater_detected
        WordPress.WP.AlternativeFunctions.file_system_operations_fopen
        WordPress.WP.AlternativeFunctions.file_system_operations_fclose
        WordPress.WP.AlternativeFunctions.file_system_operations_fwrite
        WordPress.WP.AlternativeFunctions.file_system_operations_fread
        PluginCheck.CodeAnalysis.Offloading.OffloadedContent
        WordPress.DB.DirectDatabaseQuery.DirectQuery
        WordPress.DB.DirectDatabaseQuery.NoCaching
        WordPress.DB.DirectDatabaseQuery.SchemaChange
        WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedVariableFound
