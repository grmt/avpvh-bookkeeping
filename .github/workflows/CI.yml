name: "CI"
on:
  # Branches are tested through their pull request (the merge result);
  # main once more after each merge.
  push:
    branches: [main]
  pull_request:
env:
  cache-version: 1
jobs:
  lint:
    name: "Tests (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    # The PHP floor (the servers' PHP) and the newest PHP.
    strategy:
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, dom, simplexml, mbstring, fileinfo
          coverage: none

      - name: "Cache Composer dependencies"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: "~/.composer/cache"
          key: composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Install Composer dependencies"
        run: |
          composer install -n --prefer-dist

      - name: "Run test suite"
        # Loops over every tests/*.php file instead of listing each one as
        # its own step — a new test file used to need a matching step
        # added here by hand, and nothing caught it if that was forgotten
        # (found 2026-10-30: 7 of 16 test files had no step at all, so they
        # never ran in CI). ::group::/::endgroup:: keeps each test's output
        # foldable in the Actions log, same readability as separate steps.
        run: |
          status=0
          for f in tests/*.php; do
            echo "::group::$f"
            if php "$f"; then
              echo "PASS: $f"
            else
              echo "FAIL: $f"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: "Company workbook upload browser handler regression"
        run: node tests/test-company-export.cjs

      - name: "Invoice mailbox and statement extraction tests"
        run: python3 -m unittest discover -s tests -p 'test_company_*.py'

  # What a deploy ships: git archive honours export-ignore in .gitattributes
  # (tests, CI files, docs, *.md, dotfiles, composer files), plus the runtime
  # vendor/ that a deploy syncs separately. Plugin Check runs on this, so a
  # new dev-only file only needs an export-ignore line, nothing here.
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      # The runner's own PHP is older than the plugin's floor.
      - name: "Set up PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.4"
          coverage: none

      - name: "Install runtime dependencies"
        run: composer install -n --prefer-dist --no-dev --no-progress

      - name: "Package what a deploy ships"
        run: |
          mkdir build
          git archive HEAD | tar -x -C build
          cp -r vendor build/

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "build-artifact"
          path: build

  # Shared with the other own plugins: dependencies on the PHP floor, syntax on
  # 8.4 and 8.5, PHPCompatibility and the WordPress.org Plugin Check (on the
  # build above).
  plugin-checks:
    name: "Shared"
    needs: [lint, build]
    uses: grmt/wp-plugin-ci/.github/workflows/plugin-checks.yml@main
    with:
      slug: avpvh-bookkeeping
      artifact: build-artifact
      # Keep checking association compatibility alongside the standalone
      # company mode: the sibling members plugin supplies AVPVH_DB and
      # AVPVH_Roles to the association workflows.
      extra-plugins: |
        grmt/avpvh-members
      # No whole checks are skipped, and warnings are never ignored: they
      # don't fail the job, but stay visible in the report. That includes
      # the DirectDatabaseQuery ones (the custom $wpdb layer in class-db.php),
      # NonPrefixedVariableFound (admin/*.php template partials, included
      # from class methods) and the Nonce/ValidatedSanitizedInput ones
      # (handlers checked by hand on 2026-08-24: nonces are checked before
      # $_POST is read, and inputs are cast or sanitized).
      #
      # Ignored, as errors that don't apply: the direct fopen/fread/fclose
      # calls read the first bytes of an upload to check its file type, and
      # fopen/fwrite write CSV exports to php://output — WP_Filesystem has
      # no equivalent for either. plugin_updater_detected is the Update URI
      # to this repo. OffloadedContent is not ignored here: the one false
      # positive (the Google Photos download allowlist) has an inline
      # phpcs:ignore in class-google-photos-picker.php, so real offloaded
      # assets elsewhere still fail the job.
      ignore-codes: |
        plugin_updater_detected
        WordPress.WP.AlternativeFunctions.file_system_operations_fopen
        WordPress.WP.AlternativeFunctions.file_system_operations_fclose
        WordPress.WP.AlternativeFunctions.file_system_operations_fwrite
        WordPress.WP.AlternativeFunctions.file_system_operations_fread
