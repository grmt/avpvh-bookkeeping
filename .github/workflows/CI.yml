name: "CI"
on:
  push:
    # "*" only matches single-segment branch names (no "/") — "**" is
    # needed to also cover "fix/..."-style branches (see avpvh-members'
    # same workflow, which hit this).
    branches: "**"
  pull_request:
env:
  php-version: 8.2
  cache-version: 1
jobs:
  lint:
    name: "PHP Lint"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.php-version }}
          extensions: zip, dom, simplexml, mbstring, fileinfo
          coverage: none

      - name: "Cache Composer dependencies"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: "~/.composer/cache"
          key: composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Install Composer dependencies"
        run: |
          composer install -n --prefer-dist

      - name: "PHP syntax check"
        run: |
          find . -path ./vendor -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: "Run test suite"
        # Loops over every tests/*.php file instead of listing each one as
        # its own step — a new test file used to need a matching step
        # added here by hand, and nothing caught it if that was forgotten
        # (found 2026-10-30: 7 of 16 test files had no step at all, so they
        # never ran in CI). ::group::/::endgroup:: keeps each test's output
        # foldable in the Actions log, same readability as separate steps.
        run: |
          status=0
          for f in tests/*.php; do
            echo "::group::$f"
            if php "$f"; then
              echo "PASS: $f"
            else
              echo "FAIL: $f"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  plugin-check:
    name: "WordPress Plugin Check"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: "Checkout avpvh-bookkeeping"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: avpvh-bookkeeping

      # Bookkeeping refuses to activate without avpvh-members' AVPVH_DB/
      # AVPVH_Roles (every lookup goes through those) — check it out as a
      # sibling so the .wp-env.override.json below can hand it to wp-env
      # as a second plugin to install and activate alongside this one.
      # It's public, so no token/auth needed.
      - name: "Checkout avpvh-members"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grmt/avpvh-members
          ref: main
          path: avpvh-members

      - name: "Setup PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.php-version }}
          extensions: zip, dom, simplexml, mbstring, fileinfo
          coverage: none

      - name: "Install Composer dependencies"
        working-directory: avpvh-bookkeeping
        run: |
          composer install -n --prefer-dist --no-dev

      # plugin-check-action always (re)writes its own .wp-env.json in the
      # workspace root right before starting wp-env, so a .wp-env.json
      # committed inside avpvh-bookkeeping/ itself is never actually read.
      # wp-env's own override mechanism is the supported way to layer
      # extra config onto a file you don't control: a .wp-env.override.json
      # next to it gets merged in automatically. testsEnvironment:false
      # also skips building the unused tests-cli/tests-wordpress images
      # (wp-env builds both by default) — Plugin Check never touches them,
      # and that build has its own flaky third-party composer download.
      - name: "Add avpvh-members as an extra wp-env plugin"
        run: |
          echo '{ "plugins": ["./avpvh-members"], "testsEnvironment": false }' > .wp-env.override.json

      # No continue-on-error here (found 2026-10-30: it had been silently
      # masking real exit-1 failures on every run — fixed in PRs #82/#83).
      # Everything that's excluded below is excluded deliberately via
      # exclude-checks/exclude-files/exclude-directories/ignore-codes, not
      # by swallowing the step's own exit code.
      - name: "Run plugin check"
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: avpvh-bookkeeping
          exclude-directories: |
            .claude
            .github
            bin
            tests
          # Agent instruction docs live at the plugin root on purpose; they
          # aren't shipped plugin content (exact filenames only, globs are
          # not matched by plugin-check-action).
          exclude-files: |
            .gitignore
            .gitattributes
            AGENTS.md
            CLAUDE.md
          # direct_db_queries: this plugin's whole DB layer is custom
          # $wpdb queries (see class-db.php) — an architectural choice,
          # not a gap, same reasoning as avpvh-members.
          # plugin_readme / trademarks: wordpress.org-submission checks
          # that don't apply — this is a private single-site plugin,
          # tightly coupled to avpvh-members, never meant for WP.org.
          # prefixing: entirely WordPress.NamingConventions.PrefixAllGlobals
          # findings on admin/*.php — those are template partials only ever
          # `include`d from inside a class method (see class-admin.php's
          # render calls), never loaded standalone, so their top-level
          # variables aren't really in the global namespace at runtime.
          exclude-checks: |
            direct_db_queries
            plugin_readme
            trademarks
            prefixing
          # Verified false positives, not a real backlog (checked every
          # handler by hand on 2026-08-24): every admin-post/admin-ajax
          # handler in this plugin calls check_admin_referer()/
          # check_ajax_referer() before touching $_POST — the Nonce
          # sniff just doesn't correlate that across the function. Every
          # flagged $_POST/$_GET/$_FILES read is already either cast
          # ((int)/(float)/array_map('intval', ...)) or run through
          # sanitize_*(wp_unslash(...)) — the sniff doesn't recognize
          # sanitization inside a `(int) ($_POST['x'] ?? 0)` cast, or
          # is_uploaded_file() as the correct check for a $_FILES tmp_name.
          ignore-codes: |
            WordPress.Security.NonceVerification.Missing
            WordPress.Security.NonceVerification.Recommended
            WordPress.Security.ValidatedSanitizedInput.InputNotSanitized
            WordPress.Security.ValidatedSanitizedInput.InputNotValidated
            WordPress.Security.ValidatedSanitizedInput.MissingUnslash
            plugin_updater_detected
            WordPress.WP.AlternativeFunctions.file_system_operations_fopen
            WordPress.WP.AlternativeFunctions.file_system_operations_fclose
            WordPress.WP.AlternativeFunctions.file_system_operations_fwrite
            WordPress.WP.AlternativeFunctions.file_system_operations_fread
            PluginCheck.CodeAnalysis.Offloading.OffloadedContent
