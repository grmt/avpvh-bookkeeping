name: "CI"
on:
  push:
    branches: "*"
  pull_request:
env:
  php-version: 8.2
  cache-version: 1
jobs:
  lint:
    name: "PHP Lint"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ env.php-version }}
          coverage: none

      - name: "Cache Composer dependencies"
        uses: actions/cache@v6
        with:
          path: "~/.composer/cache"
          key: composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Install Composer dependencies"
        run: |
          composer install -n --prefer-dist

      - name: "PHP syntax check"
        run: |
          find . -path ./vendor -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l

  plugin-check:
    name: "WordPress Plugin Check"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: "Checkout avpvh-bookkeeping"
        uses: actions/checkout@v7
        with:
          path: avpvh-bookkeeping

      # Bookkeeping refuses to activate without avpvh-members' AVPVH_DB/
      # AVPVH_Roles (every lookup goes through those) — check it out as a
      # sibling so .wp-env.json (committed in this repo) can hand it to
      # wp-env as a second plugin to install and activate alongside this
      # one. It's public, so no token/auth needed.
      - name: "Checkout avpvh-members"
        uses: actions/checkout@v7
        with:
          repository: grmt/avpvh-members
          ref: main
          path: avpvh-members

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ env.php-version }}
          coverage: none

      - name: "Install Composer dependencies"
        working-directory: avpvh-bookkeeping
        run: |
          composer install -n --prefer-dist --no-dev

      # plugin-check-action always (re)writes its own .wp-env.json in the
      # workspace root right before starting wp-env, so a .wp-env.json
      # committed inside avpvh-bookkeeping/ itself is never actually read.
      # wp-env's own override mechanism is the supported way to layer
      # extra config onto a file you don't control: a .wp-env.override.json
      # next to it gets merged in automatically.
      - name: "Add avpvh-members as an extra wp-env plugin"
        run: |
          echo '{ "plugins": ["./avpvh-members"] }' > .wp-env.override.json

      - name: "Run plugin check"
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: avpvh-bookkeeping
          exclude-directories: |
            .claude
          # Report-only for now, same as avpvh-members — this plugin
          # predates Plugin Check and hasn't been triaged against it yet.
          # Findings still show in the run log and the uploaded
          # plugin-check-results artifact; this just stops CI going red
          # over a pre-existing backlog nobody's looked at.
          ignore-warnings: true
          ignore-errors: true
